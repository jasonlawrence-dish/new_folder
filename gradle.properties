org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Pin Gradle to Android Studio's bundled JDK (jbr = JDK 17/21) so CLI builds
# (.\gradlew.bat) use the same JDK as the IDE. Without this, a plain terminal
# spawns the Gradle daemon on the system JDK (here: JDK 26), which Gradle 8.7
# cannot parse -> fails with a bare "26" / IllegalArgumentException: 26.
org.gradle.java.home=C:\\Program Files\\Android\\Android Studio\\jbr
